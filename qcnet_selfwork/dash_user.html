<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Portal</title>
    <link rel="stylesheet" href="dash_style.css">
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body>
    <div class="blob"></div><div class="blob b2"></div>
    <nav class="sidebar glass-panel fade-in">
        <h2 style="margin-top:5px; margin-bottom:15px; color:#a89bc2;">👤 User Panel</h2>
        <button onclick="window.location.href='dash_profile.html'">👤 My Profile</button>
        <button onclick="window.location.href='dash_chat.html'">💬 Chat</button>
        <button onclick="renderUserUI('my_payments')">💳 Payments</button>
        <button onclick="renderUserUI('products')">🛍️ Buy Products</button>
        <button onclick="renderUserUI('reminders')">⏰ Alerts</button>
        <button onclick="renderUserUI('links')">🔗 Links</button>
        <div style="margin-top: auto;"><hr>
            <button onclick="window.location.href='login.html'" style="width:100%; margin-bottom:10px; background:rgba(139,92,246,0.2); border-color:#8b5cf6; color:#c4b5fd;">💬 Open QuickChat</button>
            <button onclick="window.location.href='dash_theme_studio.html'" style="width:100%; margin-bottom:10px;">🎨 Theme Studio</button>
            <button onclick="logout()" style="width:100%; background:rgba(255,107,107,0.2); color:#ff6b6b; border-color:#ff6b6b;">Log Out</button>
        </div>
    </nav>
    <main class="main-content">
        <div id="top-bar" class="top-bar glass-panel fade-in">Loading User Info...</div>
        <div class="glass-panel fade-in" style="padding:25px;">
            <header><h1 id="module-title" style="margin-top:0; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:15px;">Welcome</h1></header>
            <div id="content-area"><p>Loading records...</p></div>
        </div>
    </main>
    <script src="dash_script.js"></script>
</body>
</html>
